name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android klasörünü oluştur
        run: |
          flutter create . --platforms=android --org com.tadimnotlarim --project-name tadim_notlarim
          sed -i -E 's/android:label="[^"]*"/android:label="Tadım Notlarım"/' android/app/src/main/AndroidManifest.xml
          # ML Kit yalnızca Latin alfabesi kullanıyor; diğer dil paketlerini aramasın
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF
          flutter pub get
          dart run flutter_launcher_icons || echo "Simge üretilemedi, varsayılan simgeyle devam"

      - name: APK derle
        run: flutter build apk --release

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: tadim-notlarim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
