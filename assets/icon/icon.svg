<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs><radialGradient id="bg" cx="0.5" cy="0.38" r="0.75"><stop offset="0" stop-color="#9B2A4B"/><stop offset="0.6" stop-color="#5E1428"/><stop offset="1" stop-color="#3A0915"/></radialGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <defs>
